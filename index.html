<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descubra por que você procrastina — Levanta e Vai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D0D0D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:2rem 1rem}
.wrap{max-width:520px;margin:0 auto}
.tag{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#A855F7;margin-bottom:.5rem}
h1{font-size:22px;font-weight:600;line-height:1.3;margin-bottom:.5rem}
.sub{font-size:14px;color:#AAAAAA;line-height:1.6;margin-bottom:1.5rem}
.progress{height:3px;background:#1A1A2E;border-radius:2px;margin-bottom:1.5rem}
.progress-fill{height:3px;background:#7F77DD;border-radius:2px;transition:width .3s}
.card{background:#111;border:1px solid #1A1A2E;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.q-num{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#A855F7;margin-bottom:.5rem}
.q-text{font-size:16px;font-weight:500;color:#fff;margin-bottom:1rem;line-height:1.5}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #1A1A2E;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14px;color:#DDDDDD;transition:all .15s;background:#0D0D0D}
.opt:hover{border-color:#534AB7;background:#0F0820}
.opt.sel{border-color:#7F77DD;background:#0F0820;color:#fff}
.opt-l{width:24px;height:24px;border-radius:50%;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;color:#888}
.opt.sel .opt-l{background:#7F77DD;border-color:#7F77DD;color:#fff}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:.5rem}
.btn{padding:10px 20px;border:1px solid #333;border-radius:8px;background:transparent;font-size:14px;font-weight:500;cursor:pointer;color:#fff}
.btn:hover{background:#1A1A2E}
.btn-p{background:#7F77DD;border-color:#7F77DD;color:#fff}
.btn-p:hover{background:#534AB7}
.btn-p:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:500;margin-bottom:1rem}
.r-title{font-size:20px;font-weight:600;margin-bottom:.5rem;line-height:1.4}
.r-desc{font-size:14px;color:#AAAAAA;line-height:1.7;margin-bottom:1rem}
.bullet{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:14px;color:#AAAAAA}
.bullet-dot{color:#A855F7;font-size:18px;line-height:1;flex-shrink:0}
.r-cta{font-size:13px;color:#888;margin-bottom:.75rem}
.btn-cta{display:block;width:100%;padding:16px;background:#7F77DD;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:.75rem;text-align:center;text-decoration:none;transition:background .15s}
.btn-cta:hover{background:#534AB7}
.intro-cta{display:block;width:100%;padding:14px;background:#7F77DD;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:1rem;text-align:center}
.intro-cta:hover{background:#534AB7}
.reset{background:transparent;border:none;color:#666;font-size:13px;cursor:pointer;margin-top:.75rem;display:block}
.hidden{display:none}
.divider-small{height:1px;background:#1A1A2E;margin:1rem 0}
.next-step{background:#0F0820;border:1px solid #2A1A4E;border-radius:8px;padding:1rem;margin-top:1rem}
.next-step p{font-size:12px;color:#666;margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.06em}
.next-step strong{font-size:14px;color:#DDDDDD;display:block;margin-bottom:.5rem}
</style>

<script>

    api_host: 'https://us.i.posthog.com',
    defaults: '2026-01-30',
    person_profiles: 'identified_only'
});
</script>
</head>
<body>
<div class="wrap">

  <div id="intro">
    <div class="tag">teste de perfil mental</div>
    <h1>Descubra por que você procrastina</h1>
    <p class="sub">7 perguntas. Menos de 2 minutos.<br>Descubra qual padrão mental está travando sua ação.</p>
    <button class="intro-cta" onclick="startTest()">Começar o teste</button>
  </div>

  <div id="quiz" class="hidden">
    <div class="progress"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    <div class="card">
      <div class="q-num" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
      <div id="q-opts"></div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-back" onclick="prevQ()" style="display:none">Voltar</button>
      <button class="btn btn-p" id="btn-next" onclick="nextQ()" disabled>Próxima</button>
    </div>
  </div>

  <div id="result" class="hidden">
    <div class="tag">seu resultado</div>
    <div class="card">
      <div id="r-badge" class="badge"></div>
      <div id="r-title" class="r-title"></div>
      <div id="r-desc" class="r-desc"></div>
      <div id="r-bullets"></div>
      <div class="divider-small"></div>
      <div id="r-cta" class="r-cta"></div>
      <div class="next-step">
        <p>próximo passo</p>
        <strong>O Guia Prático para Destravar sua Mente</strong>
        <a
          href="https://ebooktdah.lovable.app"
          class="btn-cta"
          onclick="trackGuideClick(event)"
        >
          Quero o guia — R$27 →
        </a>
      </div>
    </div>
    <button class="reset" onclick="resetTest()">Refazer o teste</button>
  </div>

</div>

<script>
var questions=[
  {text:"Quando você pensa em começar algo importante, o que acontece primeiro?",opts:[{l:"A",t:"Minha mente trava e eu fico parado",p:"T"},{l:"B",t:"Começo a pensar em tudo que precisa ser feito e me sobrecarrego",p:"S"},{l:"C",t:"Pego o celular ou me distraio com outra coisa",p:"D"},{l:"D",t:"Começo animado mas logo perco o ritmo",p:"T"}]},
  {text:"Qual frase mais representa o que você sente no dia a dia?",opts:[{l:"A",t:"Sei exatamente o que fazer, mas simplesmente não começo",p:"T"},{l:"B",t:"Tenho muita coisa na cabeça e não consigo organizar",p:"S"},{l:"C",t:"Meu foco some rápido — qualquer coisa me tira da tarefa",p:"D"},{l:"D",t:"Me sinto mentalmente cansado mesmo sem ter feito quase nada",p:"S"}]},
  {text:"Quando uma tarefa exige esforço mental, você geralmente:",opts:[{l:"A",t:"Adia para quando estiver com mais disposição",p:"T"},{l:"B",t:"Tenta fazer várias coisas ao mesmo tempo e não termina nenhuma",p:"S"},{l:"C",t:"Se distrai no meio e esquece o que estava fazendo",p:"D"},{l:"D",t:"Sente um bloqueio e não consegue nem começar",p:"T"}]},
  {text:"Como você costuma lidar com prazos e compromissos?",opts:[{l:"A",t:"Só consigo funcionar quando o prazo está quase estourando",p:"T"},{l:"B",t:"Aceito tudo e depois não dou conta de cumprir",p:"S"},{l:"C",t:"Esqueço compromissos com frequência",p:"D"},{l:"D",t:"Planejo mas raramente executo como planejei",p:"S"}]},
  {text:"Ao final do dia, como você costuma se sentir?",opts:[{l:"A",t:"Com culpa por não ter feito o que precisava",p:"T"},{l:"B",t:"Exausto, mesmo sem ter sido produtivo",p:"S"},{l:"C",t:"Sem saber direito o que fiz durante o dia",p:"D"},{l:"D",t:"Frustrado com minha falta de consistência",p:"T"}]},
  {text:"Quando você promete para si mesmo que vai mudar, o que acontece?",opts:[{l:"A",t:"Começo com força mas trava na hora de executar",p:"T"},{l:"B",t:"Crio um plano elaborado que nunca sai do papel",p:"S"},{l:"C",t:"Me distraio com outras coisas e esqueço o plano",p:"D"},{l:"D",t:"Volto ao mesmo padrão depois de poucos dias",p:"T"}]},
  {text:"O que mais combina com sua relação com produtividade?",opts:[{l:"A",t:"Tenho potencial mas não consigo executar",p:"T"},{l:"B",t:"Fico sobrecarregado e não sei por onde começar",p:"S"},{l:"C",t:"Me perco fácil e perco o fio da meada",p:"D"},{l:"D",t:"Sei o que preciso mas meu cérebro não coopera",p:"T"}]}
];

var profiles={
  T:{badge:"Mente Travada",badgeBg:"#1A0A2E",badgeColor:"#A855F7",title:"Você sabe o que fazer — mas trava na hora de começar.",desc:"Seu cérebro aprendeu a associar esforço com desconforto e automaticamente evita o início. Não é falta de vontade. É um padrão neurológico que pode ser reprogramado.",bullets:["Você precisa de gatilhos de ativação","Pequenas ações quebram o bloqueio","A regra dos 5 segundos foi feita pra você"],cta:"O guia abaixo foi criado exatamente para esse padrão."},
  S:{badge:"Mente Sobrecarregada",badgeBg:"#0A1A10",badgeColor:"#22C55E",title:"Você tem muitas ideias — mas pouca estrutura para executar.",desc:"Sua mente vive em modo urgência. Você começa muito e termina pouco. O problema não é energia — é falta de um sistema que organize o que fazer primeiro.",bullets:["Você precisa de rituais e organização mental","Aprender a fazer menos, melhor","Criar um sistema de prioridades simples"],cta:"O guia abaixo te dá a estrutura que sua mente precisa."},
  D:{badge:"Mente Dispersa",badgeBg:"#1A0A0A",badgeColor:"#F97316",title:"Seu foco some rápido — e você sabe disso.",desc:"Seu cérebro busca estímulos constantemente. Qualquer coisa nova compete com o que é importante. Não é falta de inteligência — é um sistema de atenção que precisa de apoio externo.",bullets:["Você precisa de sistemas externos de foco","Eliminar distrações do ambiente é prioridade","Rituais curtos ajudam o cérebro a se fixar"],cta:"O guia abaixo te ensina a criar esse ambiente de foco."}
};

var current=0,answers=[],selected=null;
var currentResultType=null;
var quizStartedTracked=false;
var resultViewedTracked=false;

function getUTMParams(){
  var params = new URLSearchParams(window.location.search);
  return {
    utm_source: params.get('utm_source') || '',
    utm_medium: params.get('utm_medium') || '',
    utm_campaign: params.get('utm_campaign') || '',
    utm_content: params.get('utm_content') || '',
    utm_term: params.get('utm_term') || ''
  };
}

function getBaseEventProps(){
  return {
    page_url: window.location.href,
    page_path: window.location.pathname,
    page_title: document.title,
    ...getUTMParams()
  };
}

function safeCapture(eventName, props){
  try{
    if(window.posthog && typeof window.posthog.capture === 'function'){
      window.posthog.capture(eventName, props || {});
    }
  }catch(e){
    console.error('Erro ao enviar evento para o PostHog:', eventName, e);
  }
}

function startTest(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');

  if(!quizStartedTracked){
    safeCapture('quiz_started', {
      ...getBaseEventProps(),
      quiz_name: 'teste_mental',
      total_questions: questions.length
    });
    quizStartedTracked = true;
  }

  renderQ();
}

function renderQ(){
  var q=questions[current];
  selected=answers[current]!==undefined?answers[current]:null;
  document.getElementById('q-num').textContent='Pergunta '+(current+1)+' de '+questions.length;
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('prog').style.width=((current/questions.length)*100)+'%';
  document.getElementById('btn-back').style.display=current>0?'inline-block':'none';
  var nb=document.getElementById('btn-next');
  nb.disabled=selected===null;
  nb.textContent=current===questions.length-1?'Ver resultado':'Próxima';
  var c=document.getElementById('q-opts');
  c.innerHTML='';
  q.opts.forEach(function(o,i){
    var d=document.createElement('div');
    d.className='opt'+(selected===i?' sel':'');
    d.innerHTML='<span class="opt-l">'+o.l+'</span><span>'+o.t+'</span>';
    d.onclick=function(){selectOpt(i);};
    c.appendChild(d);
  });
}

function selectOpt(i){
  selected=i;
  answers[current]=i;
  document.getElementById('btn-next').disabled=false;

  var option = questions[current].opts[i];
  safeCapture('quiz_question_answered', {
    ...getBaseEventProps(),
    quiz_name: 'teste_mental',
    question_number: current + 1,
    question_text: questions[current].text,
    answer_letter: option.l,
    answer_text: option.t,
    answer_profile: option.p
  });

  renderQ();
}

function nextQ(){
  if(selected===null)return;
  if(current<questions.length-1){
    current++;
    selected=answers[current]!==undefined?answers[current]:null;
    renderQ();
  } else {
    showResult();
  }
}

function prevQ(){
  if(current>0){current--;renderQ();}
}

function showResult(){
  var count={T:0,S:0,D:0};
  answers.forEach(function(a,i){count[questions[i].opts[a].p]++;});
  var top=Object.entries(count).sort(function(a,b){return b[1]-a[1];})[0][0];
  var p=profiles[top];
  currentResultType = top;

  safeCapture('quiz_completed', {
    ...getBaseEventProps(),
    quiz_name: 'teste_mental',
    total_questions: questions.length,
    answers_count: answers.length,
    result_type: top,
    result_label: p.badge,
    score_T: count.T,
    score_S: count.S,
    score_D: count.D
  });

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  var prog = document.getElementById('prog');
  if(prog) prog.style.width='100%';

  var b=document.getElementById('r-badge');
  b.textContent=p.badge;
  b.style.background=p.badgeBg;
  b.style.color=p.badgeColor;
  document.getElementById('r-title').textContent=p.title;
  document.getElementById('r-desc').textContent=p.desc;
  document.getElementById('r-cta').textContent=p.cta;
  var bul=document.getElementById('r-bullets');
  bul.innerHTML=p.bullets.map(function(b){
    return '<div class="bullet"><span class="bullet-dot">+</span>'+b+'</div>';
  }).join('');

  if(!resultViewedTracked){
    safeCapture('quiz_result_viewed', {
      ...getBaseEventProps(),
      quiz_name: 'teste_mental',
      result_type: top,
      result_label: p.badge
    });
    resultViewedTracked = true;
  }
}

function trackGuideClick(event){
  safeCapture('quiz_cta_clicked', {
    ...getBaseEventProps(),
    quiz_name: 'teste_mental',
    result_type: currentResultType || '',
    destination_url: 'https://ebooktdah.lovable.app',
    cta_text: 'Quero o guia — R$27 →'
  });
}

function resetTest(){
  current=0;
  answers=[];
  selected=null;
  currentResultType=null;
  quizStartedTracked=false;
  resultViewedTracked=false;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
}
</script>
</body>
</html>
