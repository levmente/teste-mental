<html lang="pt-BR">
<head>

<title>Descubra por que você procrastina — Levanta e Vai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D0D0D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:2rem 1rem}
.wrap{max-width:520px;margin:0 auto}
.tag{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#A855F7;margin-bottom:.5rem}
h1{font-size:22px;font-weight:600;line-height:1.3;margin-bottom:.5rem}
.sub{font-size:14px;color:#AAAAAA;line-height:1.6;margin-bottom:1.5rem}
.progress{height:3px;background:#1A1A2E;border-radius:2px;margin-bottom:1.5rem}
.progress-fill{height:3px;background:#7F77DD;border-radius:2px;transition:width .3s}
.card{background:#111;border:1px solid #1A1A2E;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.q-num{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#A855F7;margin-bottom:.5rem}
.q-text{font-size:16px;font-weight:500;color:#fff;margin-bottom:1rem;line-height:1.5}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #1A1A2E;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14px;color:#DDDDDD;transition:all .15s;background:#0D0D0D}
.opt:hover{border-color:#534AB7;background:#0F0820}
.opt.sel{border-color:#7F77DD;background:#0F0820;color:#fff}
.opt-l{width:24px;height:24px;border-radius:50%;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;color:#888}
.opt.sel .opt-l{background:#7F77DD;border-color:#7F77DD;color:#fff}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:.5rem}
.btn{padding:10px 20px;border:1px solid #333;border-radius:8px;background:transparent;font-size:14px;font-weight:500;cursor:pointer;color:#fff}
.btn:hover{background:#1A1A2E}
.btn-p{background:#7F77DD;border-color:#7F77DD;color:#fff}
.btn-p:hover{background:#534AB7}
.btn-p:disabled{opacity:.4;cursor:not-allowed}

/* Resultado */
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;margin-bottom:1.25rem;letter-spacing:.04em}
.badge-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.r-card{background:#111;border:1px solid #1A1A2E;border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.r-title{font-size:20px;font-weight:700;margin-bottom:.75rem;line-height:1.35;color:#fff}
.r-hook{font-size:15px;color:#DDDDDD;line-height:1.7;margin-bottom:1.25rem;font-style:italic;border-left:3px solid #7F77DD;padding-left:1rem;border-radius:0}
.r-desc{font-size:14px;color:#AAAAAA;line-height:1.75;margin-bottom:1.25rem}
.bullets-title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#555;margin-bottom:.75rem}
.bullet{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:14px;color:#CCCCCC;line-height:1.55}
.bullet-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px}
.divider{height:1px;background:#1A1A2E;margin:1.25rem 0}

/* Bloco de oferta */
.offer-block{background:#0A0A1A;border:1px solid #2A1A4E;border-radius:10px;padding:1.25rem;margin-top:1rem}
.offer-tag{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#7F77DD;margin-bottom:.5rem}
.offer-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:.25rem;line-height:1.4}
.offer-sub{font-size:13px;color:#888;margin-bottom:1rem;line-height:1.55}
.offer-price{display:flex;align-items:baseline;gap:8px;margin-bottom:1rem}
.price-from{font-size:12px;color:#555;text-decoration:line-through}
.price-now{font-size:24px;font-weight:700;color:#A855F7}
.price-label{font-size:12px;color:#666}
.btn-cta{display:block;width:100%;padding:16px;background:#7F77DD;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;transition:background .15s;letter-spacing:.01em}
.btn-cta:hover{background:#534AB7}
.trust{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:.75rem;flex-wrap:wrap}
.trust-item{font-size:11px;color:#555;display:flex;align-items:center;gap:4px}
.trust-dot{width:3px;height:3px;border-radius:50%;background:#333;flex-shrink:0}
.social-proof{background:#111827;border:1px solid #1F2937;border-radius:8px;padding:.875rem 1rem;margin-top:.75rem;display:flex;align-items:flex-start;gap:10px}
.sp-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.sp-text{font-size:13px;color:#9CA3AF;line-height:1.5}
.sp-text strong{color:#D1D5DB;font-weight:500}

.reset{background:transparent;border:none;color:#555;font-size:13px;cursor:pointer;margin-top:.75rem;display:block;width:100%;text-align:center;padding:.5rem}
.reset:hover{color:#888}
.hidden{display:none}

/* Intro */
.intro-stats{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.intro-stat{flex:1;min-width:100px;background:#111;border:1px solid #1A1A2E;border-radius:8px;padding:.875rem;text-align:center}
.intro-stat-num{font-size:18px;font-weight:700;color:#A855F7;display:block;margin-bottom:.2rem}
.intro-stat-label{font-size:11px;color:#666}
.intro-cta{display:block;width:100%;padding:14px;background:#7F77DD;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:1rem;text-align:center;transition:background .15s}
.intro-cta:hover{background:#534AB7}
.intro-note{font-size:12px;color:#555;text-align:center;margin-top:.5rem}
</style>

var current=0,answers=[],selected=null;
var currentResultType=null;
var quizStartedTracked=false;
var resultViewedTracked=false;

function getUTMParams(){
  var params=new URLSearchParams(window.location.search);
  return{
    utm_source:params.get('utm_source')||'',
    utm_medium:params.get('utm_medium')||'',
    utm_campaign:params.get('utm_campaign')||'',
    utm_content:params.get('utm_content')||'',
    utm_term:params.get('utm_term')||''
  };
}

function getBaseEventProps(){
  return{
    page_url:window.location.href,
    page_path:window.location.pathname,
    page_title:document.title,
    ...getUTMParams()
  };
}

function safeCapture(eventName,props){
  try{
    if(window.posthog&&typeof window.posthog.capture==='function'){
      window.posthog.capture(eventName,props||{});
    }
  }catch(e){
    console.error('PostHog error:',eventName,e);
  }
}

function startTest(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  if(!quizStartedTracked){
    safeCapture('quiz_started',{
      ...getBaseEventProps(),
      quiz_name:'teste_mental',
      total_questions:questions.length
    });
    quizStartedTracked=true;
  }
  renderQ();
}

function renderQ(){
  var q=questions[current];
  selected=answers[current]!==undefined?answers[current]:null;
  document.getElementById('q-num').textContent='Pergunta '+(current+1)+' de '+questions.length;
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('prog').style.width=((current/questions.length)*100)+'%';
  document.getElementById('btn-back').style.display=current>0?'inline-block':'none';
  var nb=document.getElementById('btn-next');
  nb.disabled=selected===null;
  nb.textContent=current===questions.length-1?'Ver meu resultado →':'Próxima →';
  var c=document.getElementById('q-opts');
  c.innerHTML='';
  q.opts.forEach(function(o,i){
    var d=document.createElement('div');
    d.className='opt'+(selected===i?' sel':'');
    d.innerHTML='<span class="opt-l">'+o.l+'</span><span>'+o.t+'</span>';
    d.onclick=function(){selectOpt(i);};
    c.appendChild(d);
  });
}

function selectOpt(i){
  selected=i;
  answers[current]=i;
  document.getElementById('btn-next').disabled=false;
  var option=questions[current].opts[i];
  safeCapture('quiz_question_answered',{
    ...getBaseEventProps(),
    quiz_name:'teste_mental',
    question_number:current+1,
    question_text:questions[current].text,
    answer_letter:option.l,
    answer_text:option.t,
    answer_profile:option.p
  });
  renderQ();
}

function nextQ(){
  if(selected===null)return;
  if(current<questions.length-1){
    current++;
    selected=answers[current]!==undefined?answers[current]:null;
    renderQ();
  }else{
    showResult();
  }
}

function prevQ(){
  if(current>0){current--;renderQ();}
}

function showResult(){
  var count={T:0,S:0,D:0};
  answers.forEach(function(a,i){count[questions[i].opts[a].p]++;});
  var top=Object.entries(count).sort(function(a,b){return b[1]-a[1];})[0][0];
  var p=profiles[top];
  currentResultType=top;

  safeCapture('quiz_completed',{
    ...getBaseEventProps(),
    quiz_name:'teste_mental',
    total_questions:questions.length,
    answers_count:answers.length,
    result_type:top,
    result_label:p.badgeText,
    score_T:count.T,
    score_S:count.S,
    score_D:count.D
  });

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');

  var prog=document.getElementById('prog');
  if(prog)prog.style.width='100%';

  renderResult(top,p);

  if(!resultViewedTracked){
    safeCapture('quiz_result_viewed',{
      ...getBaseEventProps(),
      quiz_name:'teste_mental',
      result_type:top,
      result_label:p.badgeText
    });
    resultViewedTracked=true;
  }
}

  var bulletsHTML=p.bullets.map(function(b,i){
    return '<div class="bullet">'+
      '<div class="bullet-num" style="background:'+p.bulletBg+';color:'+p.bulletColor+'">'+(i+1)+'</div>'+
      '<span>'+b+'</span>'+
    '</div>';
  }).join('');

  document.getElementById('r-card').innerHTML=
    '<div class="badge" style="background:'+p.badgeBg+';color:'+p.badgeColor+'">'+
      '<span class="badge-dot" style="background:'+p.badgeColor+'"></span>'+
      p.badgeText+
    '</div>'+
    '<div class="r-title">'+p.title+'</div>'+
    '<div class="r-hook" style="border-left-color:'+p.hookBorder+'">'+p.hook+'</div>'+
    '<div class="r-desc">'+p.desc+'</div>'+
    '<div class="bullets-title">'+p.bulletsTitle+'</div>'+
    bulletsHTML+
    '<div class="divider"></div>'+
    '<div class="offer-block">'+
      '<div class="offer-tag">próximo passo recomendado para você</div>'+
      '<div class="offer-title">Guia Prático para Destravar sua Mente</div>'+
      '<div class="offer-sub">'+p.offerSub+'</div>'+
      '<div class="offer-price">'+
        '<span class="price-from">R$97</span>'+
        '<span class="price-now">R$27</span>'+
        '<span class="price-label">— acesso imediato</span>'+
      '</div>'+
      '<a href="https://ebooktdah.lovable.app" class="btn-cta" onclick="trackCTAClick(event)">'+
        'Quero o guia agora →'+
      '</a>'+
      '<div class="trust">'+
        '<span class="trust-item">✓ Acesso imediato</span>'+
        '<span class="trust-dot"></span>'+
        '<span class="trust-item">✓ Pagamento seguro</span>'+

  safeCapture('quiz_cta_clicked',{
    ...getBaseEventProps(),
    quiz_name:'teste_mental',
    result_type:currentResultType||'',
    result_label:currentResultType?profiles[currentResultType].badgeText:'',
    destination_url:'https://ebooktdah.lovable.app',
    cta_text:'Quero o guia agora →'
  });
}

function resetTest(){
  current=0;
  answers=[];
  selected=null;
  currentResultType=null;
  quizStartedTracked=false;
  resultViewedTracked=false;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
}
